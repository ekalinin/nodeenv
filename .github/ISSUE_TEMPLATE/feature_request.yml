name: Feature request
description: Suggest a new feature or a change in nodeenv
labels: [new-feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How should nodeenv behave instead?
    validations:
      required: true
