name: Pages

on:
  push:
    branches:
    - master
    paths:
    - 'site/**'
    - 'CHANGES'
    - 'Makefile'
    - '.github/workflows/pages.yml'
  pull_request:
    paths:
    - 'site/**'
    - 'CHANGES'
    - 'Makefile'
    - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    # site/ is copied as is, and the changelog page is rendered from
    # CHANGES with docutils.
    - name: Build site
      run: |
        python -m pip install docutils
        make site

    - uses: actions/upload-pages-artifact@v5
      with:
        path: _site

  deploy:
    name: Deploy site
    needs: build
    # Pull requests only build the site: the github-pages environment
    # takes deployments from master only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # One deployment at a time; a queued run waits instead of cancelling
    # the one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
    - uses: actions/configure-pages@v6

    - id: deployment
      uses: actions/deploy-pages@v5
