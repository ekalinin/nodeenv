[build-system]
requires = ["setuptools>=77", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "nodeenv"
dynamic = ["version", "readme"]
description = "Node.js virtual environment builder"
license = "BSD-3-Clause"
authors = [{ name = "Eugene Kalinin", email = "e.v.kalinin@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
certifi = ["certifi"]
completion = ["shtab>=1.11"]

[project.urls]
Homepage = "https://github.com/ekalinin/nodeenv"

[project.scripts]
nodeenv = "nodeenv:main"

[tool.setuptools]
py-modules = ["nodeenv"]

[tool.setuptools.dynamic]
version = { attr = "nodeenv.nodeenv_version" }
readme = { file = ["README.rst", "CHANGES"], content-type = "text/x-rst" }
